name: build
# Weekly rebuild picks up new Hermes stable, Claude Code and the DirectSDK plugin, so images never go stale.
on:
  push: { branches: [main] }
  schedule: [{ cron: '23 7 * * 1' }]
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: build, cancel-in-progress: false }
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker build -t ghcr.io/kvnloo/agent-base:latest -t ghcr.io/kvnloo/agent-base:${GITHUB_SHA::7} images/base
          docker run --rm --entrypoint bash ghcr.io/kvnloo/agent-base:latest -c 'claude --version && hermes --version | head -1 && gh --version | head -1 && uv --version'
          docker push -a ghcr.io/kvnloo/agent-base
  repo:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { image: [hermes-android, dash, glide, hermex] }
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          n=ghcr.io/kvnloo/agent-${{ matrix.image }}
          docker build --label org.opencontainers.image.source=https://github.com/kvnloo/agent-images -t $n:latest -t $n:${GITHUB_SHA::7} images/${{ matrix.image }}
          docker push -a $n
