name: build
# Weekly rebuild picks up new Hermes stable, Claude Code and the DirectSDK plugin, so images never go stale.
# Pull requests build and smoke-test the base image but never push.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '23 7 * * 1' }]
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: "build-${{ github.ref }}", cancel-in-progress: false }
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker build -t ghcr.io/kvnloo/agent-base:latest -t ghcr.io/kvnloo/agent-base:${GITHUB_SHA::7} images/base
          docker run --rm --entrypoint bash ghcr.io/kvnloo/agent-base:latest -c 'claude --version && hermes --version | head -1 && gh --version | head -1 && uv --version'
      - name: boat profile installs and is unattended
        run: |
          docker run --rm --entrypoint bash -e HERMES_HOME=/tmp/h ghcr.io/kvnloo/agent-base:latest -c '
            set -e; agent-setup
            test "$(cat /tmp/h/.agent-setup-done)" = boat
            head -1 /tmp/h/SOUL.md | grep -qx "# Boat Hermes"
            for kv in approvals.mode=off approvals.single_query_mode=approve approvals.cron_mode=approve approvals.unattended_mode=approve; do
              got=$(hermes config get ${kv%%=*} | tail -1); echo "${kv%%=*}=$got"; test "$got" = "${kv#*=}"
            done'
          docker run --rm --entrypoint bash -e HERMES_HOME=/tmp/h -e AGENT_PROFILE=none ghcr.io/kvnloo/agent-base:latest -c '
            set -e; agent-setup; test ! -f /tmp/h/SOUL.md; echo "AGENT_PROFILE=none keeps upstream defaults"'
      - if: github.event_name != 'pull_request'
        run: docker push -a ghcr.io/kvnloo/agent-base
  repo:
    needs: base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { image: [hermes-android, dash, glide, hermex] }
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          n=ghcr.io/kvnloo/agent-${{ matrix.image }}
          docker build --label org.opencontainers.image.source=https://github.com/kvnloo/agent-images -t $n:latest -t $n:${GITHUB_SHA::7} images/${{ matrix.image }}
          docker push -a $n
